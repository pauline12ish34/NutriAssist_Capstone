[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriassist"
version = "0.1.0"
description = "NutriAssist-RW: a bilingual (English/Kinyarwanda) child-nutrition assistant for caregivers in Rwanda"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",    # character n-gram matching of questions to the reviewed answers
]

[project.optional-dependencies]
# Metrics used in the notebook and by the evaluation tests.
eval = [
    "sacrebleu>=2.4",
    "rouge-score>=0.1.2",
]
# QLoRA fine-tuning on a GPU (Google Colab).
train = [
    "nutriassist[eval]",
    "torch>=2.2",
    "transformers>=4.56",
    "peft>=0.14",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "datasets>=2.19",                 # the Kinyarwanda corpus for continued pre-training
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# The API server. llama-cpp-python runs the GGUF model on the CPU; on Windows install it from the
# prebuilt wheels: pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.23",
]
# NLLB-200 machine translation (NUTRIASSIST_KINYARWANDA=translate, and scripts/evaluate_pipeline.py).
# Off in the app: a native speaker judged the translations not good enough (docs/kinyarwanda.md).
# For a CPU-only torch add --extra-index-url https://download.pytorch.org/whl/cpu
translate = [
    "torch>=2.2",
    "transformers>=4.56",
    "sentencepiece>=0.2",
]
# Optional sentence embeddings for matching (off by default: they did not help, see docs/kinyarwanda.md).
embeddings = [
    "sentence-transformers>=3.0",
]
# The Streamlit frontend.
app = [
    "streamlit>=1.45",
    "requests>=2.31",
]
dev = [
    "nutriassist[eval]",
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "streamlit>=1.45",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: end-to-end tests with a tiny real model (need torch and transformers)"]
