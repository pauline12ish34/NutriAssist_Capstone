# Runs the test suite on every push and pull request, on Linux, Windows and macOS.
# Tests that need a GPU model, PyTorch or a GGUF file skip themselves when those are missing.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"   # the oldest Python the package supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q -rs

  # The Space (deploy/hf-zerogpu/app.py) clones this repository only when it starts, so a push reaches
  # the live app only after a restart. A factory rebuild starts from a fresh container and clones main again.
  deploy:
    name: Restart the Hugging Face Space
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Factory rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import HfApi; HfApi().restart_space('pauline-ish/nutriAssist_Rw', factory_reboot=True); print('Space restarting')"
